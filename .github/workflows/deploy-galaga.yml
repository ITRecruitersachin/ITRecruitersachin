name: 🎮 Generate Galaga Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    name: 🚀 Generate Galaga
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:

      - name: 🎮 Generate Galaga Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ITRecruitersachin
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "galaga"

      - name: 📤 Publish Galaga SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
